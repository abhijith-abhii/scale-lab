apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: scale-lab}
  template:
    metadata:
      labels: {app: scale-lab}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: scale-lab:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: scale-lab}
spec:
  selector: {app: scale-lab}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: scale-lab}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: scale-lab}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
