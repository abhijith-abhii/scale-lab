name: Kubernetes autoscaling experiment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: scale-lab
      - run: docker build -t scale-lab:local .
      - run: kind load docker-image scale-lab:local --name scale-lab
      - run: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
      - name: Configure metrics for disposable kind cluster only
        run: kubectl patch deployment metrics-server -n kube-system --type=json -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
      - run: kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s
      - run: kubectl apply -f k8s.yaml
      - run: kubectl rollout status deployment/scale-lab --timeout=120s
      - name: Generate load
        run: kubectl run load --image=busybox:1.36 --restart=Never -- /bin/sh -c 'for i in 1 2 3 4 5 6 7 8; do while true; do wget -q -O- http://scale-lab/work; done & done; wait'
      - name: Observe actual scale up
        run: |
          for i in $(seq 1 48); do
            kubectl get hpa scale-lab
            replicas=$(kubectl get deployment scale-lab -o jsonpath='{.spec.replicas}')
            if [ "$replicas" -gt 2 ]; then echo "Observed scale-up to $replicas replicas" > hpa-evidence.txt; exit 0; fi
            sleep 5
          done
          echo 'No scale-up observed within four minutes'; exit 1
      - name: Collect cluster evidence
        if: always()
        run: |
          kubectl get hpa,pods,deployments -o wide >> hpa-evidence.txt
          kubectl describe hpa scale-lab >> hpa-evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpa-evidence
          path: hpa-evidence.txt
